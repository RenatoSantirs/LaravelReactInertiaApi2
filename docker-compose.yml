services:
  app:
    build: .
    ports:
      - "8000:80"
      - "5173:5173"
    volumes:
      - .:/var/www/html:cached
      # Volúmenes anónimos: usan node_modules y vendor de la imagen, no los del host
      - /var/www/html/node_modules
      - /var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
    networks:
      - laravel

  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_USER: laravel
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - laravel

volumes:
  dbdata:

networks:
  laravel:
